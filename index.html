<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Life App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>My Life App</h1>

  <section>
    <h2>Habits</h2>
    <form id="add-habit-form">
      <input type="text" id="habit-name-input" placeholder="New habit, e.g. Drink water" required />
      <button type="submit">Add</button>
    </form>
    <ul id="habit-list"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
